<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F5F5F0"/>

  <!-- Element 1: Title (y=140) -->
  <text x="600" y="140" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="300" fill="#2B2B2B" letter-spacing="-2">lightleft</text>

  <!-- Element 2: Tagline (y=210) -->
  <text x="600" y="210" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#2B2B2B" opacity="0.5" letter-spacing="3">HOW MUCH DAYLIGHT IS LEFT</text>

  <!-- Element 3: Sun circle (y=340, r=90 → spans 250–430) -->
  <circle cx="600" cy="340" r="90" fill="#E9A800"/>

  <!-- Element 4: Horizon bar (y=470, well below circle bottom at 430) -->
  <rect x="440" y="468" width="320" height="6" rx="3" fill="#2B2B2B"/>
  <rect x="440" y="468" width="160" height="6" rx="3" fill="#2B2B2B"/>
</svg>
